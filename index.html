<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibrant Neon Strings - 品牌展示版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020105; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* --- 修改後的右下角鏡頭樣式 --- */
        #input_video { 
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px; /* 視窗寬度 */
            height: 120px; /* 視窗高度 */
            z-index: 30;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), 0 0 5px rgba(255, 255, 255, 0.2);
            object-fit: cover;
            /* 鏡像翻轉，讓使用者動作與畫面一致 */
            transform: scaleX(-1);
            background-color: #000;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6); font-size: 18px; z-index: 10;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #footer-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .gold-text {
            color: #FFD700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .separator {
            color: rgba(255, 255, 255, 0.8);
            margin: 0 8px;
            font-weight: 300;
        }

        .rainbow-text {
            background-image: linear-gradient(to right, #ff3333, #ff9933, #ffff33, #33ff33, #3399ff, #cc33ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        @media (max-width: 600px) {
            #footer-text { font-size: 16px; bottom: 20px; }
            /* 手機版縮小鏡頭 */
            #input_video { width: 100px; height: 75px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

<div id="loading">正在啟動鮮明光效...</div>
<video id="input_video"></video>
<canvas id="canvas"></canvas>

<div id="footer-text">
    <span class="gold-text">翊華程式教育</span>
    <span class="separator">x</span>
    <span class="rainbow-text">體感互動藝術</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loadingDiv = document.getElementById('loading');
let width, height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    initStrands();
}
window.addEventListener('resize', resize);

const targetMouse = { x: -1000, y: -1000 };
const currentMouse = { x: -1000, y: -1000 };
const SMOOTHING_FACTOR = 0.1; 
let isHandDetected = false;

const randomRange = (min, max) => Math.random() * (max - min) + min;

class Node {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.ox = x; this.oy = y;
        this.pinned = false;
    }
}

class Strand {
    constructor(x, length, segmentCount, hue) {
        this.nodes = [];
        this.hue = hue;
        this.color = `hsla(${hue}, 100%, 70%, 0.85)`; 
        this.segmentLength = length / segmentCount;
        for (let i = 0; i < segmentCount; i++) {
            const y = 50 + i * this.segmentLength;
            const node = new Node(x, y);
            if (i === 0) node.pinned = true;
            this.nodes.push(node);
        }
    }

    update() {
        for (let n of this.nodes) {
            if (n.pinned) continue;
            let vx = (n.x - n.ox) * 0.96; 
            let vy = (n.y - n.oy) * 0.96;
            n.ox = n.x; n.oy = n.y;
            n.y += vy + 0.35; 
            n.x += vx;

            let dx = n.x - currentMouse.x;
            let dy = n.y - currentMouse.y;
            let dist = Math.hypot(dx, dy);

            const interactionRadius = 65;
            if (dist < interactionRadius && dist > 0.001) { 
                let force = (interactionRadius - dist) / interactionRadius;
                n.x += (dx / dist) * force * 18;
                n.y += (dy / dist) * force * 18;
                if (Math.random() < 0.025) {
                    spawnParticles(n.x, n.y, this.hue, 1);
                }
            }
        }
        for (let k = 0; k < 5; k++) {
            for (let i = 0; i < this.nodes.length - 1; i++) {
                let n1 = this.nodes[i], n2 = this.nodes[i + 1];
                let dx = n2.x - n1.x, dy = n2.y - n1.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 0.001) continue;
                let diff = (dist - this.segmentLength) / dist;
                if (!n1.pinned) { n1.x += dx * 0.5 * diff; n1.y += dy * 0.5 * diff; }
                n2.x -= dx * 0.5 * diff; n2.y -= dy * 0.5 * diff;
            }
        }
    }

    draw() {
        ctx.beginPath();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.0; 
        ctx.moveTo(this.nodes[0].x, this.nodes[0].y);
        for (let i = 1; i < this.nodes.length; i++) {
            ctx.lineTo(this.nodes[i].x, this.nodes[i].y);
        }
        ctx.stroke();
    }
}

class Particle {
    constructor(x, y, vx, vy, life, r, hue) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.life = life; this.maxLife = life;
        this.r = r * 0.7;
        this.hue = hue;
    }
    update() {
        this.life--;
        this.vx *= 0.94; this.vy *= 0.94;
        this.x += this.vx; this.y += this.vy;
        this.r *= 0.97;
    }
    draw() {
        let alpha = (this.life / this.maxLife) * 0.8;
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

let strands = [];
let particles = [];

function initStrands() {
    strands = [];
    const gap = 22;
    const totalStrands = Math.floor((width - 80) / gap);
    const strandLen = height * 0.75; 
    const segments = 24;
    let x = 40;
    for (let i = 0; i < totalStrands; i++) {
        const hue = (x / width) * 340;
        strands.push(new Strand(x, strandLen, segments, hue));
        x += gap;
    }
}

function spawnParticles(x, y, hue, amount) {
    for (let i = 0; i < amount; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = randomRange(1.0, 3.5); 
        particles.push(new Particle(x, y, Math.cos(ang)*spd, Math.sin(ang)*spd, randomRange(20, 40), randomRange(2, 3.5), hue));
    }
}

const videoElement = document.getElementById('input_video');
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
hands.onResults((results) => {
    loadingDiv.style.display = 'none';
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        isHandDetected = true;
        const indexTip = results.multiHandLandmarks[0][8];
        targetMouse.x = (1 - indexTip.x) * width;
        targetMouse.y = indexTip.y * height;
    } else { isHandDetected = false; }
});

const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 640, height: 480 });
camera.start();

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2, 1, 5, 0.3)'; 
    ctx.fillRect(0, 0, width, height);

    if (isHandDetected) {
        currentMouse.x += (targetMouse.x - currentMouse.x) * SMOOTHING_FACTOR;
        currentMouse.y += (targetMouse.y - currentMouse.y) * SMOOTHING_FACTOR;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(currentMouse.x, currentMouse.y, 8, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over'; 
    for (let s of strands) { s.update(); s.draw(); }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        if (p.life <= 0) particles.splice(i, 1);
        else p.draw();
    }
    requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>

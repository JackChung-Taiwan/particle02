<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibrant Neon Strings - 雙手互動版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020105; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #input_video { 
            position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; z-index: 30;
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), 0 0 5px rgba(255, 255, 255, 0.2);
            object-fit: cover; transform: scaleX(-1); background-color: #000;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6); font-size: 18px; z-index: 10;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #footer-text {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20;
            font-size: 24px; font-weight: 700; white-space: nowrap; pointer-events: none; letter-spacing: 1px;
        }

        .gold-text { color: #FFD700; text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5); }
        .separator { color: rgba(255, 255, 255, 0.8); margin: 0 8px; font-weight: 300; }
        .rainbow-text {
            background-image: linear-gradient(to right, #ff3333, #ff9933, #ffff33, #33ff33, #3399ff, #cc33ff);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        @media (max-width: 600px) {
            #footer-text { font-size: 16px; bottom: 20px; }
            #input_video { width: 100px; height: 75px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

<div id="loading">正在啟動雙手偵測...</div>
<video id="input_video"></video>
<canvas id="canvas"></canvas>

<div id="footer-text">
    <span class="gold-text">翊華程式教育</span>
    <span class="separator">x</span>
    <span class="rainbow-text">體感互動藝術</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loadingDiv = document.getElementById('loading');
let width, height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    initStrands();
}
window.addEventListener('resize', resize);

// --- 修改重點：支援多手追蹤 ---
// 使用陣列來儲存每一隻手的狀態
// 結構: { target: {x, y}, current: {x, y}, active: boolean }
const MAX_HANDS = 2;
let handTrackers = [];
const SMOOTHING_FACTOR = 0.15; // 稍微調快一點反應速度

// 初始化手部追蹤器
for(let i=0; i<MAX_HANDS; i++) {
    handTrackers.push({
        target: { x: -1000, y: -1000 },
        current: { x: -1000, y: -1000 },
        active: false
    });
}

const randomRange = (min, max) => Math.random() * (max - min) + min;

// 斷裂參數
const BREAK_THRESHOLD_MULTIPLIER = 5.0; 
const HEAL_TIME_FRAMES = 120; 

class Node {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.ox = x; this.oy = y;
        this.pinned = false;
        this.breakTimer = 0; 
    }
}

class Strand {
    constructor(x, length, segmentCount, hue) {
        this.nodes = [];
        this.hue = hue;
        this.color = `hsla(${hue}, 100%, 70%, 0.85)`; 
        this.segmentLength = length / segmentCount;
        for (let i = 0; i < segmentCount; i++) {
            const y = 50 + i * this.segmentLength;
            const node = new Node(x, y);
            if (i === 0) node.pinned = true;
            this.nodes.push(node);
        }
    }

    update() {
        for (let i = 0; i < this.nodes.length; i++) {
            let n = this.nodes[i];
            
            if (n.breakTimer > 0) n.breakTimer--;
            if (n.pinned) continue;

            let vx = (n.x - n.ox) * 0.96; 
            let vy = (n.y - n.oy) * 0.96;
            
            if (i > 0 && this.nodes[i-1].breakTimer > 0) {
                vx *= 0.98; vy *= 0.98;
            }

            n.ox = n.x; n.oy = n.y;
            n.y += vy + 0.35; 
            n.x += vx;

            // --- 修改重點：多手互動迴圈 ---
            // 檢查每一個啟動的手部追蹤器
            for (let h = 0; h < MAX_HANDS; h++) {
                if (!handTrackers[h].active) continue;
                
                let handX = handTrackers[h].current.x;
                let handY = handTrackers[h].current.y;

                let dx = n.x - handX;
                let dy = n.y - handY;
                let dist = Math.hypot(dx, dy);

                const interactionRadius = 65;
                if (dist < interactionRadius && dist > 0.001) { 
                    let force = (interactionRadius - dist) / interactionRadius;
                    // 力的疊加：如果兩隻手都在拉，這裡會執行兩次，產生合力
                    n.x += (dx / dist) * force * 20;
                    n.y += (dy / dist) * force * 20;
                    
                    if (Math.random() < 0.025) {
                        spawnParticles(n.x, n.y, this.hue, 1);
                    }
                }
            }
        }

        for (let k = 0; k < 5; k++) {
            for (let i = 0; i < this.nodes.length - 1; i++) {
                let n1 = this.nodes[i], n2 = this.nodes[i + 1];
                if (n1.breakTimer > 0) continue;

                let dx = n2.x - n1.x, dy = n2.y - n1.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 0.001) continue;

                if (k === 0 && dist > this.segmentLength * BREAK_THRESHOLD_MULTIPLIER) {
                    n1.breakTimer = HEAL_TIME_FRAMES; 
                    spawnParticles((n1.x + n2.x)/2, (n1.y + n2.y)/2, this.hue, 10);
                    continue; 
                }

                let diff = (dist - this.segmentLength) / dist;
                if (!n1.pinned) { n1.x += dx * 0.5 * diff; n1.y += dy * 0.5 * diff; }
                n2.x -= dx * 0.5 * diff; n2.y -= dy * 0.5 * diff;
            }
        }
    }

    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.0; 
        
        ctx.beginPath();
        ctx.moveTo(this.nodes[0].x, this.nodes[0].y);

        for (let i = 0; i < this.nodes.length - 1; i++) {
            let n1 = this.nodes[i];
            let n2 = this.nodes[i + 1];

            if (n1.breakTimer > 0) {
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(n2.x, n2.y);
            } else {
                ctx.lineTo(n2.x, n2.y);
            }
        }
        ctx.stroke();
    }
}

class Particle {
    constructor(x, y, vx, vy, life, r, hue) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.life = life; this.maxLife = life;
        this.r = r * 0.7;
        this.hue = hue;
    }
    update() {
        this.life--;
        this.vx *= 0.94; this.vy *= 0.94;
        this.x += this.vx; this.y += this.vy;
        this.r *= 0.97;
    }
    draw() {
        let alpha = (this.life / this.maxLife) * 0.8;
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

let strands = [];
let particles = [];

function initStrands() {
    strands = [];
    const gap = 22;
    const totalStrands = Math.floor((width - 80) / gap);
    const strandLen = height * 0.75; 
    const segments = 24;
    let x = 40;
    for (let i = 0; i < totalStrands; i++) {
        const hue = (x / width) * 340;
        strands.push(new Strand(x, strandLen, segments, hue));
        x += gap;
    }
}

function spawnParticles(x, y, hue, amount) {
    for (let i = 0; i < amount; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = randomRange(1.0, 5.0); 
        particles.push(new Particle(x, y, Math.cos(ang)*spd, Math.sin(ang)*spd, randomRange(20, 40), randomRange(2, 4.5), hue));
    }
}

const videoElement = document.getElementById('input_video');
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});

// --- 修改重點：maxNumHands: 2 ---
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

hands.onResults((results) => {
    loadingDiv.style.display = 'none';
    
    // 先假設所有手都沒偵測到
    for(let h=0; h<MAX_HANDS; h++) {
        handTrackers[h].active = false;
    }

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // 遍歷所有偵測到的手 (最多2隻)
        results.multiHandLandmarks.forEach((landmarks, index) => {
            if (index < MAX_HANDS) {
                const tracker = handTrackers[index];
                tracker.active = true;
                const indexTip = landmarks[8];
                tracker.target.x = (1 - indexTip.x) * width;
                tracker.target.y = indexTip.y * height;
            }
        });
    }
});

const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 640, height: 480 });
camera.start();

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2, 1, 5, 0.3)'; 
    ctx.fillRect(0, 0, width, height);

    // --- 修改重點：更新並繪製多隻手 ---
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    
    for(let h=0; h<MAX_HANDS; h++) {
        let tracker = handTrackers[h];
        if (tracker.active) {
            // 平滑移動
            tracker.current.x += (tracker.target.x - tracker.current.x) * SMOOTHING_FACTOR;
            tracker.current.y += (tracker.target.y - tracker.current.y) * SMOOTHING_FACTOR;

            // 繪製手部光點
            ctx.beginPath();
            ctx.arc(tracker.current.x, tracker.current.y, 8, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 如果手移開了，重置 current 位置以免下次進來時瞬移
            tracker.current.x = tracker.target.x;
            tracker.current.y = tracker.target.y;
        }
    }

    ctx.globalCompositeOperation = 'source-over'; 
    for (let s of strands) { s.update(); s.draw(); }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        if (p.life <= 0) particles.splice(i, 1);
        else p.draw();
    }
    requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>
